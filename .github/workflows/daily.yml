name: Daily job digest

on:
  schedule:
    # 15:00 UTC = 8:00 AM Pacific (during daylight saving; 7:00 AM in winter).
    # GitHub crons are always UTC, so edit this line to change the send time.
    - cron: '0 15 * * *'
  # workflow_dispatch lets you trigger a run manually from the Actions tab
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browser (for Dice scraper)
        run: npx playwright install --with-deps chromium

      - name: Run scraper + send digest
        run: npm start
        env:
          SCRAPE_MODE: daily
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'resend' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
